name: cenerealert
description: >
  CenereAlert — app di crowdsourcing per la segnalazione della caduta di
  cenere vulcanica nell'area etnea.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  maplibre_gl: ^0.20.0
  shared_preferences: ^2.2.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/map_style/dark_style.json

  # Font Inter caricato come asset locale: nessuna chiamata a servizi esterni
  # (Google Fonts CDN, ecc.), coerente col vincolo "nessun tracciamento
  # pubblicitario nell'MVP" e con la logica GDPR-first del progetto.
  # Scarica i tre pesi da https://fonts.google.com/specimen/Inter e mettili
  # in assets/fonts/ con questi nomi esatti prima del primo `flutter run`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
